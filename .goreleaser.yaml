version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: gistsync
    main: .
    binary: gistsync
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 100
    - title: Fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 200
    - title: Documentation
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 300
    - title: Maintenance
      regexp: '^.*?(build|chore|ci|perf|refactor|revert|style|test)(\(.+\))??!?:.+$'
      order: 400
    - title: Other
      order: 999

release:
  footer: |
    gistsync requires the [GitHub CLI](https://cli.github.com) installed and authenticated with the `gist` scope (`gh auth login`).
